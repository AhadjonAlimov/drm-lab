<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRM LAB — Kirish</title>
<style>
 body{font-family:system-ui,Arial;background:#0f1115;color:#e6e6e6;margin:0;
   min-height:100vh;display:flex;align-items:center;justify-content:center}
 .box{background:#1a1d24;border:1px solid #2b2f3a;border-radius:12px;padding:32px;width:320px}
 h1{font-size:19px;margin:0 0 4px} .sub{color:#8a8f98;font-size:13px;margin-bottom:22px}
 label{display:block;font-size:13px;color:#c8ccd4;margin:12px 0 5px}
 input{width:100%;box-sizing:border-box;background:#0f1115;border:1px solid #333;border-radius:7px;
   padding:10px;color:#e6e6e6;font-size:14px}
 button{width:100%;margin-top:20px;background:#3b6fd6;color:#fff;border:0;border-radius:7px;
   padding:11px;font-size:15px;font-weight:600;cursor:pointer}
 button:hover{background:#4f82e8}
 .hint{margin-top:16px;color:#8a8f98;font-size:12px;text-align:center}
</style>
</head>
<body>
<form class="box" method="POST" action="/login">
 <h1>🔐 DRM LAB</h1>
 <div class="sub">Himoyalangan video platformasi — kirish</div>
 <label>Login</label>
 <input name="login" autocomplete="username" autofocus>
 <label>Parol</label>
 <input name="password" type="password" autocomplete="current-password">
 <button type="submit">Kirish</button>
 <div class="hint">Sessiya 12 soat amal qiladi</div>
</form>
</body>
</html>
